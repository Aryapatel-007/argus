# What Argus watches. Models and Ollama settings live in config/models.yaml.
#
# notify: true adds the propose -> approval_gate -> execute chain to a run
# whose digest is not empty. The only action kind today is `outbox_message`
# (a file in data/outbox/), which a human approves first.

targets:
  - id: monash_ai_masters
    name: "Monash Master of Artificial Intelligence"
    url: "https://www.monash.edu/study/courses/find-a-course/artificial-intelligence-c6001"
    type: program
    frequency: weekly
    extract: [intake_dates, duration, fees, entry_requirements]
    notify: true

  - id: rmit_ai_masters
    name: "RMIT Master of Artificial Intelligence"
    url: "https://www.rmit.edu.au/study-with-us/levels-of-study/postgraduate-study/masters-by-coursework/master-of-artificial-intelligence-mc267"
    type: program
    frequency: weekly
    extract: [intake_dates, duration, fees, entry_requirements]
    notify: true

  - id: homeaffairs_skilled_visa
    name: "Australian Home Affairs — skilled migration news"
    url: "https://immi.homeaffairs.gov.au/what-we-do/skilled-migration-program"
    type: policy
    frequency: weekly
    extract: [announcement_title, announcement_date, summary]
    notify: false
